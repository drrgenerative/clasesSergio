<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="pan">
  <aside>
    <div class="eyebrow" style="color:var(--y)">Panel del profesor</div>
    <h1 id="ptitle"></h1>
    <div class="sala" id="psala"></div>
    <div id="selclase" style="margin:0 0 16px"></div>
    <ul class="nav" id="nav"></ul>
    <div style="margin-top:18px;font-size:.8rem;color:#aaa;line-height:1.5">Teclado: <b>←</b> <b>→</b> preguntas · <b>Espacio</b> revelar</div>
  </aside>
  <main>
    <div class="topbar">
      <div class="row">
        <span class="pill"><span id="cdot" class="dot"></span><span id="ctxt">Conectando</span></span>
        <span class="pill" id="pmodo"></span>
        <span class="pill">👥 <b id="nalias">0</b>&nbsp;conectados</span>
      </div>
      <div class="row">
        <button class="btn y sm" id="brep">Reporte final</button>
        <button class="btn sec sm" id="bqr">Mostrar enlace y QR</button>
        <button class="btn sec sm" id="bstop">Pausar celulares</button>
      </div>
    </div>
    <section class="card stage" id="stage"><p class="muted">Cargando…</p></section>
  </main>
</div>

<div class="overlay" id="login" hidden>
  <form class="card" id="flogin">
    <div class="eyebrow">Panel del profesor</div>
    <h2 style="margin:.3em 0">Escribe la clave</h2>
    <p class="muted">Es la clave que guardaste en Firebase (nodo <code>clave</code>).</p>
    <input id="clave" class="input" type="password" autocomplete="current-password" required>
    <div id="lerr" class="err" hidden></div>
    <div style="margin-top:12px"><button class="btn" type="submit">Entrar</button></div>
  </form>
</div>

<div class="overlay" id="qr" hidden>
  <div class="card center">
    <div class="eyebrow">Enlace para los estudiantes</div>
    <div id="qrbox" style="margin:14px auto"></div>
    <p class="link" id="qlink"></p>
    <div class="row" style="justify-content:center"><button class="btn sm" id="bcopy">Copiar enlace</button><button class="btn sec sm" id="bqrclose">Cerrar</button></div>
  </div>
</div>

<div class="overlay" id="fatal" hidden><div class="card"><h2>No se pudo iniciar</h2><p id="ftxt"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="config.js"></script>
<script src="cargar.js" data-pagina="panel.js"></script>
</body>
</html>
