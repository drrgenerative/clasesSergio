<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clase en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="stu">
  <header>
    <div><div class="eyebrow">Clase en vivo</div><div id="ctitle" class="muted" style="font-size:.85rem"></div></div>
    <div class="who"><span id="me"></span><br><span class="pill"><span id="cdot" class="dot"></span><span id="ctxt">Conectando</span></span><br><button class="btn sec sm" id="brep" hidden style="margin-top:6px">Mi reporte</button></div>
  </header>

  <section id="s-carga" class="card wait"><div class="spin"></div><p>Conectando con la clase…</p></section>

  <section id="s-error" class="card" hidden><h1>No se pudo conectar</h1><p id="errtxt"></p><button class="btn" onclick="location.reload()">Reintentar</button></section>

  <section id="s-alias" class="card" hidden>
    <h1>¡Bienvenido!</h1>
    <p class="muted">Escribe tu nombre como quieres que aparezca en la clase.</p>
    <form id="falias"><input id="alias" class="input" maxlength="40" autocomplete="given-name" placeholder="Tu nombre" required>
    <div style="margin-top:12px"><button class="btn" type="submit">Entrar</button></div></form>
  </section>

  <section id="s-espera" class="card wait" hidden><div class="spin"></div><h1 style="font-size:1.2rem">Espera la siguiente actividad</h1><p class="muted">Esta pantalla cambia sola cuando el profesor la active. No necesitas recargar.</p></section>

  <section id="s-act" class="card" hidden></section>
</div>


<script src="config.js"></script>
<script src="cargar.js" data-pagina="estudiante.js"></script>
</body>
</html>
